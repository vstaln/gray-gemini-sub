[package]
name = "gray-gemini-sub"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Google Gemini (API key) provider sidecar plugin for the gray agent harness"
license = "MIT"

[lib]
name = "gemini_sub"
path = "src/lib.rs"

[[bin]]
name = "gemini-sub"
path = "src/main.rs"

[dependencies]
gray-acp-bridge = { path = "../gray-acp-bridge" }
gray-openai-compat = { path = "../gray-openai-compat" }
serde_json = { version = "1", features = ["preserve_order"] }
